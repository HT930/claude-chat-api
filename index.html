<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #7c6af7;
      --accent-hover: #6a58e0;
      --user-bubble: #2a2f4a;
      --ai-bubble: #1e2235;
      --text: #e8eaf0;
      --text-muted: #8890b0;
      --radius: 14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .badge {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* Messages area */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .message {
      display: flex;
      gap: 12px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .message.user .avatar { background: var(--user-bubble); }
    .message.assistant .avatar { background: linear-gradient(135deg, var(--accent), #a78bfa); }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.65;
      max-width: calc(100% - 50px);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Cursor blinking during streaming */
    .cursor::after {
      content: "▋";
      animation: blink 0.8s step-end infinite;
      color: var(--accent);
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Empty state */
    #empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }

    #empty .big-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 8px;
    }

    #empty h2 { font-size: 20px; color: var(--text); font-weight: 600; }
    #empty p { font-size: 14px; max-width: 340px; }

    /* Input area */
    #input-area {
      padding: 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--text);
      font-size: 15px;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
      line-height: 1.5;
    }

    #user-input:focus { border-color: var(--accent); }
    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:active:not(:disabled) { transform: scale(0.94); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #send-btn svg { width: 20px; height: 20px; }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Error toast */
    #error-toast {
      display: none;
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #e53935;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 99;
    }

    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      #messages { padding: 16px 8px; }
      .message { gap: 8px; }
      .bubble { font-size: 14px; padding: 10px 13px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">✦</div>
  <h1>Claude Chat</h1>
  <span class="badge">gemini-1.5-flash</span>
</header>

<div id="messages">
  <div id="empty">
    <div class="big-logo">✦</div>
    <h2>Claude にメッセージを送ろう</h2>
    <p>なんでも聞いてみてください。日本語で丁寧に答えます。</p>
  </div>
</div>

<div id="input-area">
  <div class="input-wrapper">
    <textarea
      id="user-input"
      placeholder="メッセージを入力…"
      rows="1"
      autofocus
    ></textarea>
    <button id="send-btn" title="送信 (Enter)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <p class="hint">Enter で送信 / Shift+Enter で改行</p>
</div>

<div id="error-toast"></div>

<script>
  // ★ Render のデプロイ URL に書き換えてください
  const API_BASE = "https://claude-chat-api.onrender.com";

  const messagesEl = document.getElementById("messages");
  const emptyEl = document.getElementById("empty");
  const inputEl = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  const errorToast = document.getElementById("error-toast");

  let history = [];
  let isStreaming = false;

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!isStreaming) sendMessage();
    }
  });

  sendBtn.addEventListener("click", () => { if (!isStreaming) sendMessage(); });

  function showError(msg) {
    errorToast.textContent = msg;
    errorToast.style.display = "block";
    setTimeout(() => { errorToast.style.display = "none"; }, 4000);
  }

  function addMessage(role, text) {
    if (emptyEl) emptyEl.style.display = "none";

    const wrap = document.createElement("div");
    wrap.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "🧑" : "✦";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollBottom();
    return bubble;
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    isStreaming = true;
    sendBtn.disabled = true;

    history.push({ role: "user", content: text });
    addMessage("user", text);

    const bubble = addMessage("assistant", "");
    bubble.classList.add("cursor");

    let accumulated = "";

    try {
      const response = await fetch(`${API_BASE}/chat/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (payload === "[DONE]") break;

          try {
            const data = JSON.parse(payload);
            if (data.error) throw new Error(data.error);
            if (data.text) {
              accumulated += data.text;
              bubble.textContent = accumulated;
              scrollBottom();
            }
          } catch { /* ignore parse errors */ }
        }
      }

      history.push({ role: "assistant", content: accumulated });

    } catch (err) {
      bubble.textContent = "エラーが発生しました。";
      showError(err.message || "接続に失敗しました");
      history.pop();
    } finally {
      bubble.classList.remove("cursor");
      isStreaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>

</body>
</html>
